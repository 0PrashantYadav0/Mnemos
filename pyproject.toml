[project]
name = "mnemos"
version = "0.1.0"
description = "Mnemos: The Town That Never Forgets - a narrative RPG on a graph-memory NPC Brain (fully local, zero external services)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# Cognee Cloud mirror: enables the "Cognee Cloud: live" badge when
# COGNEE_API_KEY is set. Heavyweight SDK (vector/graph + LLM clients).
cognee = [
    "cognee>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemos"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
